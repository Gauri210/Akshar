<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODI recognition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>MODI character recognition</h1>
    <div class="controls">
      <select id="model" aria-label="Model">
        <option value="yolo">YOLO</option>
        <option value="cnn_svc">CNN + SVC</option>
      </select>
      <label class="pen">Pen size <input type="range" id="pen" min="4" max="28" value="12"></label>
      <button id="clear">Clear</button>
    </div>
    <p class="hint">Draw one character, dark ink on the white pad. It is recognised when you lift the pen.</p>
    <canvas id="pad" width="320" height="320" aria-label="Drawing area"></canvas>
    <div class="readout">
      <div>Prediction: <strong id="text">-</strong></div>
      <div>Top 3: <span id="top3">-</span></div>
      <div>Server latency: <span id="latency">-</span> ms</div>
      <div id="status">draw a character</div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
